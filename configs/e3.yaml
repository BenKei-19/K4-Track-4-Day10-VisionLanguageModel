name: E3
description: E2 + LoRA trên các khối attention và MLP của ViT.
model_id: Qwen/Qwen3-VL-4B-Instruct
quantization: nf4-4bit      # ViT và lm_head KHÔNG lượng tử hoá
lora: {r: 16, alpha: 32, dropout: 0.05, targets: llm+vit}
train_projector: true
lr: 2.0e-4
batch_size: 2
grad_accum: 4
max_steps: 300
seed: 42
