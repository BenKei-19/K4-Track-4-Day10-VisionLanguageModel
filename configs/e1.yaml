name: E1
description: LoRA chỉ trên LLM; đóng băng ViT và projector.
model_id: Qwen/Qwen3-VL-4B-Instruct
quantization: nf4-4bit      # ViT và lm_head KHÔNG lượng tử hoá
lora: {r: 16, alpha: 32, dropout: 0.05, targets: llm}
train_projector: false
lr: 2.0e-4
batch_size: 2
grad_accum: 4
max_steps: 300
seed: 42
